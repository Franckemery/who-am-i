kind = "mobile"
previewPath = "/who-am-i/"
title = "WHO AM I"
description = "Une application mobile personnelle et hors ligne pour écrire, conserver, rechercher et protéger ses pensées dans un espace intime et lumineux."
version = "1.0.0"
id = "artifacts/who-am-i"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/who-am-i/" ]
localPort = 21319

[services.development]
run = "pnpm --filter @workspace/who-am-i run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/who-am-i", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/who-am-i", "run", "serve" ]

[services.env]
PORT = "21319"
BASE_PATH = "/who-am-i/"
